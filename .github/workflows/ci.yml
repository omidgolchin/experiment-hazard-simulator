name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (no API calls; JS agreement uses saved outputs)
        run: pytest -q
      - name: Smoke test — tiny sweep regenerates the summary
        run: python -c "from sim.model import Settings, simulate_experiments; r = simulate_experiments(Settings(), 50, seed=0); assert 0 <= r['rate'] <= 1"
